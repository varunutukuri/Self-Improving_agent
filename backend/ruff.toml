# Ruff configuration
#
# The rule set is pinned explicitly rather than relying on ruff's defaults,
# because those defaults change between releases and would silently break CI
# on an unrelated commit.
#
#   E4/E7/E9 — pycodestyle errors worth failing a build over
#   F        — pyflakes: undefined names, unused imports, unused variables
#   I        — isort: deterministic import ordering
#
# E501 (line length) is deliberately excluded: this codebase uses column-aligned
# assignments and wide docstring tables that are more readable than a hard wrap.

target-version = "py311"
line-length = 100

exclude = [".venv", "__pycache__", ".pytest_cache"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
