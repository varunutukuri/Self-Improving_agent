name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The test suite stubs `openai` at import time (see tests/conftest.py) and
      # mocks the aiomysql pool, so the heavy ML dependencies are not needed here.
      # Installing only what the tests touch keeps CI to well under a minute
      # instead of pulling ~1GB of PyTorch for sentence-transformers.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff \
                      numpy scikit-learn aiomysql python-dotenv fastapi

      - name: Lint
        working-directory: backend
        run: ruff check . --exclude .venv

      - name: Test with coverage gate
        working-directory: backend
        run: |
          pytest tests/ -v \
            --cov=agent --cov=db \
            --cov-report=term-missing \
            --cov-fail-under=85

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
